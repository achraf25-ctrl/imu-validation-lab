name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.10", "3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -e ".[dev]"
      - run: python -m pytest          # PyBullet tests auto-skip if pybullet is not installed
      - name: Demo smoke test
        run: python -m imulab demo --out runs --duration 10 --repeats 2 --no-plots
  pybullet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev,pybullet]"
      - run: python -m pytest tests/test_pybullet.py
